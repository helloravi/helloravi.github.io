---
layout: default
---
<article class="wrap prose">
  <header class="page-header">
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  {{ content }}
  <hr class="rule">
  <p class="endnote">
    Ravikanth Andhavarapu assesses whether an organization's data can prove what it
    actually did. <a href="{{ site.baseurl }}/assessment/">What that involves</a> ·
    <a href="mailto:{{ site.email }}">{{ site.email }}</a>
  </p>
</article>
