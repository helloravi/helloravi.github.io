      <a href="https://wa.me/{{ site.whatsapp_number }}">{{ site.whatsapp_display }} on WhatsApp</a>
    </p>
    <p class="footer-links">
      <a href="https://www.linkedin.com/in/ravikanth-andhavarapu/">LinkedIn</a>

      <a href="https://twitter.com/{{ site.twitter_username }}">Twitter</a>
      <a href="{{ "/feed.xml" | prepend: site.baseurl }}">RSS</a>

    <p class="footer-copy">© {{ site.time | date: "%Y" }} Ravikanth Andhavarapu</p>
